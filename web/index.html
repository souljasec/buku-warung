<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pembukuan Warung</title>
<meta name="description" content="Pembukuan sederhana untuk warung: tahu untung atau rugi setiap bulan. Bekerja tanpa internet.">
<meta name="theme-color" content="#1f5f4a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10231c" media="(prefers-color-scheme: dark)">
<!-- manifest link: added by app.js (see keepSyncLink) -->
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Warung">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="7" y="13" width="3" height="3" rx=".8" fill="currentColor"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="5.5" y="11" width="3.2" height="7" rx="1" fill="currentColor"/><rect x="10.4" y="6" width="3.2" height="12" rx="1" fill="currentColor"/><rect x="15.3" y="13.5" width="3.2" height="4.5" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-bowl" viewBox="0 0 24 24"><path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8c0-1.5 1.5-1.5 1.5-3M13.5 8c0-1.5 1.5-1.5 1.5-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M4 7h10M4 12h16M4 17h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="17.5" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="14.5" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11m0-11-11 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 5.5 20 18H4Z" fill="currentColor"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 18.5 4 6h16Z" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.5v11M8 7.5l4-4 4 4M5.5 12v6.5a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9M8 13l4-4 4 4M4.5 4.5h15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4M4.5 19.5h15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M8.5 5.5H20v13H8.5L3 12Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="m11 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div class="app">
  <nav class="tabs" aria-label="Menu utama">
    <a href="#/m" data-view="m"><svg class="ico"><use href="#i-cal"/></svg><span>Bulan</span></a>
    <a href="#/r" data-view="r"><svg class="ico"><use href="#i-chart"/></svg><span>Laporan</span></a>
    <a href="#/menu" data-view="menu"><svg class="ico"><use href="#i-bowl"/></svg><span>Menu</span></a>
    <a href="#/more" data-view="more"><svg class="ico"><use href="#i-more"/></svg><span>Lainnya</span></a>
  </nav>
  <main id="view" tabindex="-1"><p class="boot">Pembukuan Warung</p></main>
  <aside id="day" class="day" hidden></aside>
</div>

<button type="button" id="fab" class="fab" aria-label="Catat uang keluar"><svg class="ico"><use href="#i-plus"/></svg></button>
<dialog id="keypad" class="sheet"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="restore-file" accept=".json,application/json,text/plain" hidden>
<noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
</body>
</html>
